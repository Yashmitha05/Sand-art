<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Still Sand — a quiet place to make and let go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@property --bg1 { syntax: '<color>'; inherits: true; initial-value: #1b1730; }
@property --bg2 { syntax: '<color>'; inherits: true; initial-value: #0b0a15; }

:root{
  --bg1:#1b1730; --bg2:#0b0a15;
  --accent:#f0c9a8;
  --glass:rgba(18,16,30,.42);
  --glass-border:rgba(255,255,255,.08);
  --text:rgba(255,255,255,.9);
  --muted:rgba(255,255,255,.52);
  --ease:cubic-bezier(.22,.8,.24,1);
  transition:--bg1 1.8s var(--ease), --bg2 1.8s var(--ease);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(120% 90% at 50% 20%, var(--bg1) 0%, var(--bg2) 72%);
  font-family:'Inter',system-ui,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- Canvases & atmosphere ---------- */
#sand{position:fixed;left:0;top:0;z-index:1;image-rendering:crisp-edges;image-rendering:pixelated}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:none}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(130% 100% at 50% 40%, transparent 55%, rgba(0,0,0,.5) 100%)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- Brush ring ---------- */
.brush{position:fixed;left:0;top:0;z-index:20;pointer-events:none;border-radius:50%;
  border:1px solid rgba(255,255,255,.6);mix-blend-mode:difference;opacity:0;
  transition:width .3s var(--ease),height .3s var(--ease),opacity .4s}
.brush::after{content:'';position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:#fff}
.brush.show{opacity:1}

/* ---------- Brand & hint ---------- */
.brand{position:fixed;top:26px;left:30px;z-index:30;transition:opacity .8s var(--ease)}
.brand h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:27px;letter-spacing:.05em}
.brand p{margin-top:6px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--muted);transition:opacity .25s}
.brand p.fade{opacity:0}

/* ---------- Dock ---------- */
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:4px;padding:6px;border-radius:22px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  border:1px solid var(--glass-border);
  box-shadow:0 24px 60px -24px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
  max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none;
  transition:opacity .8s var(--ease), transform .8s var(--ease)}
.dock::-webkit-scrollbar{display:none}
.btn{appearance:none;border:0;background:transparent;color:var(--muted);
  height:38px;min-width:38px;padding:0 11px;border-radius:14px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font:500 12.5px/1 'Inter',sans-serif;letter-spacing:.02em;white-space:nowrap;cursor:pointer;
  transition:color .3s, background .3s, transform .2s}
.btn:hover{color:var(--text);background:rgba(255,255,255,.06)}
.btn:active{transform:scale(.95)}
.btn.on{color:var(--accent)}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn svg .f{fill:currentColor;stroke:none}
.seg{position:relative;display:flex;padding:3px;border-radius:17px;background:rgba(255,255,255,.035);flex-shrink:0}
.seg .btn{position:relative;z-index:1;height:34px}
.seg .btn:hover{background:transparent}
.seg .btn.active{color:#fff}
.glider{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.07));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 16px -8px rgba(0,0,0,.6);
  transition:transform .55s var(--ease), width .55s var(--ease)}
.sep{width:1px;height:22px;background:rgba(255,255,255,.08);margin:0 4px;flex-shrink:0}
.size{display:flex;align-items:center;gap:9px;padding:0 10px;height:38px;flex-shrink:0;color:var(--muted)}
.size .dot-s{width:4px;height:4px;border-radius:50%;background:currentColor}
.size .dot-l{width:9px;height:9px;border-radius:50%;background:currentColor}
.size input{-webkit-appearance:none;appearance:none;width:92px;height:3px;border-radius:3px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,rgba(255,255,255,.6) var(--p,25%),rgba(255,255,255,.12) var(--p,25%))}
.size input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#f4ece2;
  box-shadow:0 0 0 4px rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.5);transition:transform .2s}
.size input::-webkit-slider-thumb:hover{transform:scale(1.15)}
.size input::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#f4ece2}
.swatch{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 0 14px -2px var(--accent)}

body.immersed .dock,body.immersed .brand{opacity:.15}
body.ui-hidden .dock,body.ui-hidden .brand,body.ui-hidden .panel{opacity:0!important;pointer-events:none}

/* ---------- Palette panel ---------- */
.panel{position:fixed;left:50%;bottom:84px;z-index:31;transform:translate(-50%,10px);opacity:0;pointer-events:none;
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;border-radius:20px;width:min(430px,calc(100vw - 24px));
  background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--glass-border);
  box-shadow:0 24px 60px -24px rgba(0,0,0,.7);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.panel.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pal{border:0;background:rgba(255,255,255,.03);border-radius:14px;padding:9px;text-align:left;cursor:pointer;
  color:var(--muted);font:500 12px 'Inter',sans-serif;transition:background .3s,color .3s}
.pal:hover{background:rgba(255,255,255,.07);color:var(--text)}
.pal.active{background:rgba(255,255,255,.1);color:var(--text)}
.pal .bar{height:26px;border-radius:9px;margin-bottom:8px}
.pal small{display:block;margin-top:3px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--muted)}

/* ---------- Breathing guide ---------- */
.breath{position:fixed;top:26px;left:50%;transform:translateX(-50%);z-index:25;display:flex;flex-direction:column;align-items:center;gap:10px;
  opacity:0;pointer-events:none;transition:opacity 1.2s var(--ease)}
.breath.on{opacity:1}
.breath-ring{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.12);display:grid;place-items:center}
.orb{width:64px;height:64px;border-radius:50%;transform:scale(.5);
  background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.55),var(--accent) 42%,transparent 72%);
  box-shadow:0 0 44px -6px var(--accent);opacity:.85}
.breath-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;letter-spacing:.05em;color:var(--muted);transition:opacity .3s}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:90px;z-index:40;transform:translate(-50%,8px);opacity:0;pointer-events:none;white-space:nowrap;
  padding:9px 18px;border-radius:999px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;
  transition:opacity .5s var(--ease),transform .5s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Intro ---------- */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;
  background:rgba(8,7,14,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:opacity 1.5s var(--ease),visibility 1.5s}
.intro.gone{opacity:0;visibility:hidden}
.intro-inner{text-align:center;max-width:480px;padding:24px;animation:rise 1.8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sandfall{position:relative;width:2px;height:58px;margin:0 auto 30px}
.sandfall i{position:absolute;left:0;top:0;width:2px;height:2px;border-radius:50%;background:var(--accent);opacity:0;animation:fall 2.2s linear infinite}
.sandfall i:nth-child(2){animation-delay:.37s}.sandfall i:nth-child(3){animation-delay:.73s}
.sandfall i:nth-child(4){animation-delay:1.1s}.sandfall i:nth-child(5){animation-delay:1.47s}.sandfall i:nth-child(6){animation-delay:1.83s}
.sandfall::after{content:'';position:absolute;bottom:-2px;left:-17px;width:36px;height:9px;border-radius:50% 50% 0 0/100% 100% 0 0;background:var(--accent);opacity:.55}
@keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(52px);opacity:0}}
.intro h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(46px,9vw,72px);letter-spacing:.02em;line-height:1}
.intro .lead{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;color:rgba(255,255,255,.66);margin:16px 0 36px;line-height:1.4}
.intro-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.primary,.ghost{height:46px;padding:0 26px;border-radius:999px;font:500 14px 'Inter',sans-serif;cursor:pointer;transition:transform .25s var(--ease),box-shadow .3s,background .3s}
.primary{border:0;background:#f2e8db;color:#1a1626;box-shadow:0 12px 34px -12px rgba(242,232,219,.55)}
.primary:hover{transform:translateY(-1px);box-shadow:0 16px 40px -12px rgba(242,232,219,.7)}
.ghost{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.15)}
.ghost:hover{color:var(--text);background:rgba(255,255,255,.05)}
.keys{margin-top:38px;font-size:11.5px;color:rgba(255,255,255,.36);letter-spacing:.03em;line-height:2.1}
kbd{font:500 10.5px 'Inter',sans-serif;padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.6)}

@media (max-width:680px){
  .lbl{display:none}
  .brand{top:18px;left:20px}.brand h1{font-size:22px}.brand p{font-size:14px;max-width:60vw}
  .dock{bottom:12px}.size input{width:64px}
  .panel{bottom:72px;grid-template-columns:repeat(2,1fr)}
  .toast{bottom:76px}
  .breath{top:auto;bottom:86px}
  .keys{display:none}
}
@media (hover:none){.brush{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="sand"></canvas>
<canvas id="fx"></canvas>
<div class="vignette"></div>
<div class="grain"></div>
<div class="brush" id="brush"></div>

<header class="brand">
  <h1>Still Sand</h1>
  <p id="hint">Hold to pour. Watch where it settles.</p>
</header>

<div class="breath" id="breath">
  <div class="breath-ring"><div class="orb" id="orb"></div></div>
  <div class="breath-text" id="breathText">Breathe in</div>
</div>

<div class="panel" id="panel"></div>

<nav class="dock" id="dock">
  <div class="seg" id="modes">
    <span class="glider" id="glider"></span>
    <button class="btn active" data-mode="pour" title="Pour · 1">
      <svg viewBox="0 0 24 24"><circle class="f" cx="12" cy="4.5" r="1.1"/><circle class="f" cx="12" cy="9" r="1.1"/><circle class="f" cx="12" cy="13.5" r="1.1"/><path d="M3.5 20.5c2.8-3.6 14.2-3.6 17 0"/></svg><span class="lbl">Pour</span>
    </button>
    <button class="btn" data-mode="sketch" title="Sketch · 2">
      <svg viewBox="0 0 24 24"><path d="M4 20c4-1 7-4 10-7l5-5a2.1 2.1 0 0 0-3-3l-5 5c-3 3-6 6-7 10z"/></svg><span class="lbl">Sketch</span>
    </button>
    <button class="btn" data-mode="drift" title="Drift · 3">
      <svg viewBox="0 0 24 24"><path d="M3 9c3-3 6 3 9 0s6 3 9 0M3 15c3-3 6 3 9 0s6 3 9 0"/></svg><span class="lbl">Drift</span>
    </button>
  </div>
  <div class="sep"></div>
  <button class="btn" id="symBtn" title="Symmetry · M">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.9 2.9M15.5 15.5l2.9 2.9M5.6 18.4l2.9-2.9M15.5 8.5l2.9-2.9"/></svg><span class="lbl" id="symLabel">Off</span>
  </button>
  <label class="size" title="Brush size · [ ]"><span class="dot-s"></span><input type="range" id="size" min="4" max="60" value="18"><span class="dot-l"></span></label>
  <button class="btn" id="paletteBtn" title="Palette · P"><span class="swatch" id="swatch"></span></button>
  <div class="sep"></div>
  <button class="btn" id="releaseBtn" title="Release · Space">
    <svg viewBox="0 0 24 24"><path d="M12 3v10M8 9l4 4 4-4"/><path d="M4 20c2.5-3 13.5-3 16 0"/></svg><span class="lbl">Release</span>
  </button>
  <button class="btn" id="letgoBtn" title="Let go · C">
    <svg viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg><span class="lbl">Let go</span>
  </button>
  <div class="sep"></div>
  <button class="btn" id="breathBtn" title="Breathing guide · B">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>
  </button>
  <button class="btn" id="soundBtn" title="Sound · N"><svg viewBox="0 0 24 24" id="soundIcon"></svg></button>
  <button class="btn" id="saveBtn" title="Save · S">
    <svg viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
  </button>
</nav>

<div class="toast" id="toast"></div>

<div class="intro" id="intro">
  <div class="intro-inner">
    <div class="sandfall"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <h1>Still Sand</h1>
    <p class="lead">A quiet place to make something beautiful —<br>and gently let it go.</p>
    <div class="intro-actions">
      <button class="primary" id="beginSound">Begin with sound</button>
      <button class="ghost" id="beginSilent">Begin in silence</button>
    </div>
    <p class="keys">
      Hold &amp; drag to create · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> modes · <kbd>M</kbd> mandala<br>
      <kbd>Space</kbd> release · <kbd>C</kbd> let go · <kbd>B</kbd> breathe · <kbd>H</kbd> hide interface
    </p>
  </div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------------- Palettes ---------------- */
const PALETTES = [
  { name:'Dusk',   mood:'warm and slow',  accent:'#f0c9a8', bg:['#1b1730','#0b0a15'],
    stops:[[258,42,64],[318,45,68],[18,72,70],[38,78,74],[280,35,58]] },
  { name:'Desert', mood:'grounded',       accent:'#e8b98a', bg:['#201812','#0c0806'],
    stops:[[32,58,72],[18,52,60],[40,62,80],[10,42,48],[28,35,64]] },
  { name:'Tide',   mood:'cool and clear', accent:'#9fd8e6', bg:['#0c1a24','#04090d'],
    stops:[[192,62,58],[174,48,62],[208,58,74],[226,42,58],[186,30,82]] },
  { name:'Lotus',  mood:'soft and tender',accent:'#f4b8c8', bg:['#22131c','#0b0609'],
    stops:[[342,58,74],[300,32,76],[18,64,80],[352,42,64],[40,60,86]] },
  { name:'Moss',   mood:'quiet and green',accent:'#c9d9a6', bg:['#0f1a14','#050a07'],
    stops:[[148,30,52],[92,30,62],[46,46,70],[168,26,42],[70,22,78]] },
  { name:'Aurora', mood:'luminous',       accent:'#a7f0d6', bg:['#0d1220','#04060c'],
    stops:[[162,68,62],[190,78,64],[268,60,70],[300,52,68],[220,60,66]] },
];
let palette = PALETTES[0];

/* ---------------- Elements ---------------- */
const sandCanvas = $('#sand'), sctx = sandCanvas.getContext('2d');
const fx = $('#fx'), fctx = fx.getContext('2d');
const brushEl = $('#brush'), toastEl = $('#toast'), hintEl = $('#hint');
const sizeInput = $('#size'), panel = $('#panel');
const orb = $('#orb'), breathText = $('#breathText'), breathEl = $('#breath');

/* ---------------- State ---------------- */
// cells: 0 = empty, 1 = loose (falls), 2 = held (stays put)
let CELL = 0, W = 0, H = 0, cells = null, pix = null, img = null, offY = 0;
let vw = innerWidth, vh = innerHeight, dpr = 1;
let awake = false, dirty = false, draining = false, frameNo = 0, time = 0;
let mode = 'pour', symmetry = 1, brushR = 18, colorT = Math.random();
let introDone = false, seedFrames = 0;
const SYMS = [1, 2, 4, 6, 8, 12];
const drifters = [], MAX_DRIFT = 700;
const SP = new Float32Array(64);
const pointer = { x: vw/2, y: vh/2, lx: vw/2, ly: vh/2, bx: vw/2, by: vh/2,
                  down: false, fresh: false, pressure: 1, type: 'mouse' };

/* ---------------- Colour ---------------- */
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s = clamp(s, 0, 100) / 100; l = clamp(l, 0, 100) / 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
function samplePalette(t) {
  const st = palette.stops, n = st.length;
  const p = (((t % 1) + 1) % 1) * n, i = Math.floor(p), f = p - i;
  const a = st[i], b = st[(i + 1) % n], e = f * f * (3 - 2 * f);
  let dh = b[0] - a[0]; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
  return [a[0] + dh * e, a[1] + (b[1] - a[1]) * e, a[2] + (b[2] - a[2]) * e];
}
let baseA = [0,0,0], baseB = [0,0,0];
function refreshBase() {
  baseA = hslToRgb(...samplePalette(colorT));
  baseB = hslToRgb(...samplePalette(colorT + 0.05));
}
function grainColor() {
  const m = Math.random() * Math.random();
  let f = 0.8 + Math.random() * 0.34;
  if (Math.random() < 0.025) f = 1.42;            // occasional glinting grain
  const r = Math.min(255, (baseA[0] + (baseB[0] - baseA[0]) * m) * f) | 0;
  const g = Math.min(255, (baseA[1] + (baseB[1] - baseA[1]) * m) * f) | 0;
  const b = Math.min(255, (baseA[2] + (baseB[2] - baseA[2]) * m) * f) | 0;
  return (0xff000000 | (b << 16) | (g << 8) | r) >>> 0;
}

/* ---------------- Grid / resize ---------------- */
function resize() {
  vw = innerWidth; vh = innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  fx.width = Math.round(vw * dpr); fx.height = Math.round(vh * dpr);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (!CELL) CELL = Math.max(2, Math.round(Math.sqrt(vw * vh / 460000)));
  const nW = Math.ceil(vw / CELL), nH = Math.ceil(vh / CELL);
  if (nW !== W || nH !== H) {
    const nImg = sctx.createImageData(nW, nH);
    const nPix = new Uint32Array(nImg.data.buffer);
    const nCells = new Uint8Array(nW * nH);
    if (cells) {                                  // keep the artwork, anchored to the floor
      const dy = nH - H, mw = Math.min(W, nW);
      for (let y = 0; y < H; y++) {
        const ny = y + dy; if (ny < 0 || ny >= nH) continue;
        for (let x = 0; x < mw; x++) { const o = y * W + x, n = ny * nW + x; nCells[n] = cells[o]; nPix[n] = pix[o]; }
      }
    }
    W = nW; H = nH; cells = nCells; pix = nPix; img = nImg;
    sandCanvas.width = W; sandCanvas.height = H;
    sandCanvas.style.width = W * CELL + 'px'; sandCanvas.style.height = H * CELL + 'px';
  }
  offY = vh - H * CELL;
  sandCanvas.style.top = offY + 'px';

  pointer.by += (pointer.y - pointer.by) * 0.4;

  updateBreath(now);
  updateAudio(moved, spawned, breathScale);
  requestAnimationFrame(frame);
}

/* ---------------- Init ---------------- */
resize();
addEventListener('resize', resize);
setPalette(PALETTES[0]);
setSize(18);
$('#soundIcon').innerHTML = ICON_OFF;
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveGlider);
requestAnimationFrame(frame);
})();
</script>
</body>
